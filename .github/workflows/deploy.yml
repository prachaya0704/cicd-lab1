name: CICD Pipeline
 
on:
  push:
    branches: [ "main" ]
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
 
      - name: build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app1:latest
 
  deploy-to-production:
    runs-on: ubuntu-latest
    needs: build-and-push
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: SSH to server and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app1:latest
            docker stop cicd-app1 || true
            docker rm cicd-app1 || true
            docker run -d --name cicd-app1 -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app1:latest